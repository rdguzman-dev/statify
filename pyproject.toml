[project]
name = "statify"
version = "0.1.0"
description = "EDA of the Spotify Tracks Dataset published by Maharshi Pandya."
readme = "README.md"
authors = [
    { name = "rdguzman-dev", email = "rdguzman.dev@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "polars>=2.1.0",
    "seaborn>=0.13.2",
]

[project.scripts]
statify = "statify:main"
valence-stats = "statify.valence_stats:main"
valence-genre = "statify.valence_genre_rank:main"
valence-distribution = "statify.valence_distribution:main"
valence-mood-map = "statify.valence_mood_map:main"
valence-danceability = "statify.valence_danceability:main"
valence-popularity = "statify.valence_popularity:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
